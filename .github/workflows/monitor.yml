name: GitHub Issue Radar

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "import os; print('Token configured:', bool(os.getenv('TELEGRAM_BOT_TOKEN'))); print('Chat ID configured:', bool(os.getenv('TELEGRAM_CHAT_ID')))"
          python -c "import os; from urllib.request import Request, urlopen; from urllib.parse import urlencode; url='https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/sendMessage'; data=urlencode({'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':'🚀 GitHub Issue Radar test alert! Telegram is working.'}).encode(); req=Request(url,data=data,method='POST'); print(urlopen(req).read().decode())"

      - name: Run issue monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save issue history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f issues_seen.json

          if git diff --cached --quiet; then
            echo "Issue history has not changed."
          else
            git commit -m "Update monitored issue history"
            git push
          fi
